name: Patch stale BTO fixture
on:
  push:
    branches: ['fix/closed-loop-growth-feedback-clean']
    paths:
      - '.github/workflows/patch-bto-fixture.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/closed-loop-growth-feedback-clean
      - name: Replace published hard-coded BTO topic with a discoverable verified topic
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('tests/js/multi-channel.test.js')
          s=p.read_text()
          old='  const topic = universe.topics.find((item) => item.id === "BTO-256");\n'
          new='  const topic = discovered[0];\n  assert.ok(topic, "at least one verified unused BTO topic must remain discoverable");\n'
          if old not in s:
              raise SystemExit('expected stale BTO fixture not found')
          p.write_text(s.replace(old,new,1))
          PY
          git config user.name "fixture-fix-bot"
          git config user.email "actions@users.noreply.github.com"
          git add tests/js/multi-channel.test.js
          git commit -m "test: use a production-eligible BTO fixture"
          git push origin HEAD:fix/closed-loop-growth-feedback-clean
