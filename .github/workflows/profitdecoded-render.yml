name: ProfitDecoded render check

# Dry-run only: builds narration (edge-tts fallback voice), renders the Short with the
# ProfitDecoded renderer on a runner with a working ffmpeg, runs the assessment on the REAL
# mp4 and uploads the video as an artifact. Never touches YouTube or any secret.
on:
  pull_request:
    paths:
      - 'core/profitdecoded/**'
      - 'scripts/profitdecoded/**'
      - 'channels/profitdecoded/**'
      - '.github/workflows/profitdecoded-render.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: System packages (ffmpeg, ImageMagick, fonts)
        run: bash scripts/ci-apt.sh ffmpeg imagemagick fonts-dejavu-core fonts-liberation
      - run: npm install --no-audit --no-fund
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Kokoro voice packages (free, open source, CPU)
        run: pip install --quiet kokoro-onnx soundfile
      - name: Kokoro model cache
        id: kokoro-cache
        uses: actions/cache@v4
        with:
          path: kokoro-model
          key: kokoro-onnx-model-files-v1.0
      - name: Kokoro model files (download once, then cached)
        if: steps.kokoro-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p kokoro-model
          curl -fL --retry 3 -o kokoro-model/kokoro-v1.0.onnx https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/kokoro-v1.0.onnx
          curl -fL --retry 3 -o kokoro-model/voices-v1.0.bin https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/voices-v1.0.bin
      - name: Model checksums (pin these once reviewed)
        run: sha256sum kokoro-model/*
      - name: Narration + music (Short)
        env:
          PD_TTS_PROVIDER: kokoro
          PD_KOKORO_MODEL: ${{ github.workspace }}/kokoro-model/kokoro-v1.0.onnx
          PD_KOKORO_VOICES: ${{ github.workspace }}/kokoro-model/voices-v1.0.bin
          PD_KOKORO_PYTHON: python
        run: node scripts/profitdecoded/produce-audio.js channels/profitdecoded/dryruns/short-costco-membership/bundle.json
      - name: Render the Short (no upload)
        run: node scripts/profitdecoded/render.js channels/profitdecoded/dryruns/short-costco-membership/bundle.json
      - name: Assess the rendered file
        run: node profitdecoded.js dry-run channels/profitdecoded/dryruns/short-costco-membership/bundle.json
      - name: Keep review artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: profitdecoded-short-render
          path: |
            channels/profitdecoded/dryruns/short-costco-membership/out/video.mp4
            channels/profitdecoded/dryruns/short-costco-membership/out/video-contact-sheet.png
            channels/profitdecoded/dryruns/short-costco-membership/out/review-report.md
            channels/profitdecoded/dryruns/short-costco-membership/out/assessment.json
            channels/profitdecoded/dryruns/short-costco-membership/out/visual-diversity.md
          if-no-files-found: warn
          retention-days: 14

  # The first-minute motion prototype, rendered on a clean runner from pinned dependencies only:
  # playwright-core 1.56.1 + its Chromium headless shell, @fontsource OFL fonts (package.json, exact versions),
  # Kokoro narration (Apache-2.0). Proves the render does not depend on the author's machine. No upload.
  motion-prototype:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: System packages (ffmpeg)
        run: bash scripts/ci-apt.sh ffmpeg
      - run: npm install --no-audit --no-fund
      - name: Pinned render dependencies
        run: node -e 'const p=require("./package.json").devDependencies; for (const k of ["playwright-core","@fontsource/source-serif-4","@fontsource/inter","@fontsource/barlow-semi-condensed"]) { if (!/^\d+\.\d+\.\d+$/.test(p[k]||"")) { console.error(k+" is not pinned to an exact version"); process.exit(1); } console.log(k, p[k], "installed", require(k+"/package.json").version); }'
      - name: Chromium headless shell cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ms-playwright-headless-shell-1.56.1
      - name: Chromium headless shell (version pinned by playwright-core)
        run: npx playwright-core install --only-shell chromium
      - name: Kokoro voice packages (pinned)
        run: pip install --quiet kokoro-onnx==0.6.1 soundfile==0.14.0
      - name: Kokoro model cache
        id: kokoro-cache
        uses: actions/cache@v4
        with:
          path: kokoro-model
          key: kokoro-onnx-model-files-v1.0
      - name: Kokoro model files (download once, then cached)
        if: steps.kokoro-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p kokoro-model
          curl -fL --retry 3 -o kokoro-model/kokoro-v1.0.onnx https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/kokoro-v1.0.onnx
          curl -fL --retry 3 -o kokoro-model/voices-v1.0.bin https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/voices-v1.0.bin
      - name: Model checksums (pinned)
        run: |
          echo "7d5df8ecf7d4b1878015a32686053fd0eebe2bc377234608764cc0ef3636a6c5  kokoro-model/kokoro-v1.0.onnx" | sha256sum -c
          echo "bca610b8308e8d99f32e6fe4197e7ec01679264efed0cac9140fe9c29f1fbf7d  kokoro-model/voices-v1.0.bin" | sha256sum -c
      - name: Prototype narration (Kokoro, channel voice)
        env:
          PD_TTS_PROVIDER: kokoro
          PD_KOKORO_MODEL: ${{ github.workspace }}/kokoro-model/kokoro-v1.0.onnx
          PD_KOKORO_VOICES: ${{ github.workspace }}/kokoro-model/voices-v1.0.bin
          PD_KOKORO_PYTHON: python
        run: node scripts/profitdecoded/produce-audio.js channels/profitdecoded/prototypes/gift-cards-first-minute/bundle.json
      - name: Render the prototype (headless Chromium + ffmpeg, no upload)
        run: node scripts/profitdecoded/motion/render-motion.js channels/profitdecoded/prototypes/gift-cards-first-minute
      - name: Technical QA on the rendered file
        run: |
          D=channels/profitdecoded/prototypes/gift-cards-first-minute/out
          node scripts/profitdecoded/motion/qa-media.js $D/prototype.mp4 --srt $D/captions.srt --out $D/qa.json
          ffmpeg -v error -y -i $D/prototype.mp4 -vf "fps=1/4,scale=480:-2,tile=4x4:padding=4" -frames:v 1 $D/contact-sheet.png
      - name: Thumbnails and component sheet
        run: |
          node scripts/profitdecoded/motion/render-thumbnails.js channels/profitdecoded/prototypes/gift-cards-first-minute
          node scripts/profitdecoded/motion/render-thumbnails.js channels/profitdecoded/prototypes/gift-cards-first-minute --spec components-demo.js --size 1920x1080 --prefix component
      - name: Keep review artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: profitdecoded-motion-prototype
          path: |
            channels/profitdecoded/prototypes/gift-cards-first-minute/out/prototype.mp4
            channels/profitdecoded/prototypes/gift-cards-first-minute/out/captions.srt
            channels/profitdecoded/prototypes/gift-cards-first-minute/out/qa.json
            channels/profitdecoded/prototypes/gift-cards-first-minute/out/timeline.json
            channels/profitdecoded/prototypes/gift-cards-first-minute/out/audio-master.json
            channels/profitdecoded/prototypes/gift-cards-first-minute/out/visual-diversity.md
            channels/profitdecoded/prototypes/gift-cards-first-minute/out/contact-sheet.png
            channels/profitdecoded/prototypes/gift-cards-first-minute/out/thumb-*.png
            channels/profitdecoded/prototypes/gift-cards-first-minute/out/component-*.png
          if-no-files-found: warn
          retention-days: 14
