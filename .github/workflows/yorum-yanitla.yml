name: YouTube comment replies

# Comment replies are deliberately independent from video production. A day
# that already has a scheduled video must not prevent new comments from being
# checked. Minute 17 avoids GitHub Actions' busiest top-of-hour window.
on:
  schedule:
    # Every four hours (UTC); Europe/Istanbul is UTC+3 year-round.
    - cron: '17 1,5,9,13,17,21 * * *'
  workflow_dispatch:

# The reply state lives under icerik/, which the production workflow also
# commits. Sharing its lock prevents two jobs from racing while pushing state.
concurrency:
  group: portfolio-production
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  reply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
      YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
      YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
      FR_YT_CLIENT_ID: ${{ secrets.FR_YT_CLIENT_ID }}
      FR_YT_CLIENT_SECRET: ${{ secrets.FR_YT_CLIENT_SECRET }}
      FR_YT_REFRESH_TOKEN: ${{ secrets.FR_YT_REFRESH_TOKEN }}
      FR_YT_CHANNEL_ID: ${{ vars.FR_YT_CHANNEL_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Reply to eligible new comments
        run: node yorum-yanitla.js --channel failure-reconstructed --limit 4

      - name: Persist processed comment IDs
        if: always()
        run: |
          git config user.name "comment-reply-bot"
          git config user.email "actions@users.noreply.github.com"
          git add icerik/yanitlanan.json
          if git diff --cached --quiet; then
            echo "No new comment state to persist."
            exit 0
          fi
          git commit -m "chore: persist processed YouTube comments"
          for i in 1 2 3 4 5; do
            git pull --rebase --autostash origin main && git push origin HEAD:main && exit 0
            echo "Push attempt $i failed; retrying."
            sleep $((i * 5))
          done
          exit 1
