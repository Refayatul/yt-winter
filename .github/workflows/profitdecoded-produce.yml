name: ProfitDecoded autonomous production (dry run)

# Research (web search + fetch with citations) -> verified dossier -> script -> narration -> render ->
# assessment, all in the cloud. It NEVER uploads: output is an artifact for human review.
# Needs ONE of the repository secrets GROQ_API_KEY (free tier) or ANTHROPIC_API_KEY. Spend/token guards stop the run.
on:
  workflow_dispatch:
    inputs:
      topic:
        description: 'Topic id (empty = let the decision engine pick)'
        required: false
        default: ''
      format:
        description: 'short or long'
        required: true
        default: 'short'
        type: choice
        options:
          - short
          - long
      provider:
        description: 'LLM provider (groq or anthropic)'
        required: true
        default: 'groq'
        type: choice
        options:
          - groq
          - anthropic
      max_usd:
        description: 'Spend guard in USD'
        required: true
        default: '3'

permissions:
  contents: read

jobs:
  produce:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: System packages (ffmpeg, ImageMagick, fonts)
        run: sudo apt-get update && sudo apt-get install -y ffmpeg imagemagick fonts-dejavu-core fonts-liberation
      - run: npm install --no-audit --no-fund
      - run: pip install --quiet kokoro-onnx soundfile
      - name: Kokoro model cache
        id: kokoro-cache
        uses: actions/cache@v4
        with:
          path: kokoro-model
          key: kokoro-onnx-model-files-v1.0
      - name: Kokoro model files (download once, then cached)
        if: steps.kokoro-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p kokoro-model
          curl -fL --retry 3 -o kokoro-model/kokoro-v1.0.onnx https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/kokoro-v1.0.onnx
          curl -fL --retry 3 -o kokoro-model/voices-v1.0.bin https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/voices-v1.0.bin
      - name: Check the selected provider's API key secret exists
        env:
          PROVIDER: ${{ inputs.provider }}
          ANTHROPIC_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GROQ_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          if [ "$PROVIDER" = "groq" ] && [ -z "$GROQ_KEY" ]; then echo "::error::Repository secret GROQ_API_KEY is not set"; exit 1; fi
          if [ "$PROVIDER" = "anthropic" ] && [ -z "$ANTHROPIC_KEY" ]; then echo "::error::Repository secret ANTHROPIC_API_KEY is not set"; exit 1; fi
      - name: Autonomous production (dry run, no upload)
        env:
          PD_AUTO_PROVIDER: ${{ inputs.provider }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          PD_FETCH_CONTACT: https://github.com/${{ github.repository }}
          PD_TTS_PROVIDER: kokoro
          PD_KOKORO_MODEL: ${{ github.workspace }}/kokoro-model/kokoro-v1.0.onnx
          PD_KOKORO_VOICES: ${{ github.workspace }}/kokoro-model/voices-v1.0.bin
          PD_KOKORO_PYTHON: python
          TOPIC: ${{ inputs.topic }}
          FORMAT: ${{ inputs.format }}
          MAX_USD: ${{ inputs.max_usd }}
        run: |
          if [ -n "$TOPIC" ]; then
            node scripts/profitdecoded/auto-produce.js --topic "$TOPIC" --format "$FORMAT" --max-usd "$MAX_USD" --through assess
          else
            node scripts/profitdecoded/auto-produce.js --format "$FORMAT" --max-usd "$MAX_USD" --through assess
          fi
      - name: Keep review artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: profitdecoded-auto-production
          path: |
            channels/profitdecoded/auto/**/bundle.json
            channels/profitdecoded/auto/**/out/video.mp4
            channels/profitdecoded/auto/**/out/review-report.md
            channels/profitdecoded/auto/**/out/assessment.json
            channels/profitdecoded/auto/**/out/narration-only.wav
            channels/profitdecoded/research/*.json
            channels/profitdecoded/state/auto-runs.json
          if-no-files-found: warn
          retention-days: 14
