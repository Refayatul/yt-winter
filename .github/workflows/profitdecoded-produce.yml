name: ProfitDecoded autonomous production (dry run)

# Research (web search + fetch with citations) -> verified dossier -> script -> narration -> render ->
# assessment, all in the cloud. It NEVER uploads: output is an artifact for human review.
# Needs ONE of the repository secrets GROQ_API_KEY (free tier) or PD_ANTHROPIC_API_KEY (ProfitDecoded-only name: other
# channels read ANTHROPIC_API_KEY). Paid runs also need the committed budget policy approval; spend/token guards stop the run.
# Daily schedule is OFF until the repository variable PD_AUTO_SCHEDULE is set to true (Settings, Variables).
# Scheduled runs produce one Short (provider groq) at the channel's US-friendly production time; never upload.
on:
  schedule:
    - cron: '50 11 * * 1-5'
  workflow_dispatch:
    inputs:
      topic:
        description: 'Topic id (empty = let the decision engine pick)'
        required: false
        default: ''
      format:
        description: 'short or long'
        required: true
        default: 'short'
        type: choice
        options:
          - short
          - long
      provider:
        description: 'LLM provider (groq or anthropic)'
        required: true
        default: 'groq'
        type: choice
        options:
          - groq
          - anthropic
      max_usd:
        description: 'Paid-API limit for this script in USD (0 = paid providers are refused). Also capped by channels/profitdecoded/budget-policy.json, which must have paidEnabled=true.'
        required: true
        default: '0'
      budget_pool:
        description: 'Paid budget pool: script (production, needs decision-engine clearance) or experiment'
        required: false
        default: 'script'
        type: choice
        options:
          - script
          - experiment
      through:
        description: 'Stop after: preflight (checks only, no LLM call), script (story only) or assess (narration + render + assessment)'
        required: false
        default: 'assess'
        type: choice
        options:
          - assess
          - script
          - preflight
      critic:
        description: 'Independent critique provider: same (as the writer) or gemini (free tier)'
        required: false
        default: 'same'
        type: choice
        options:
          - same
          - gemini
      model:
        description: 'Claude model id for an anthropic run (must match the approval; checked on the Models API before any call)'
        required: false
        default: 'claude-opus-5-5'
        type: choice
        options:
          - claude-opus-5-5
          - claude-haiku-5-5
      script_version:
        description: 'Script version in the ledger id topic:format:version (empty = repository variable PD_SCRIPT_VERSION or v1)'
        required: false
        default: ''
      token_guard:
        description: 'Free-provider token guard for the whole run (PD_AUTO_MAX_TOKENS)'
        required: false
        default: '400000'

# contents: write is used only by the paid-API budget ledger (GitHub Contents API, branch profitdecoded-budget-ledger).
permissions:
  contents: write

# One run per topic+format at a time: a duplicate dispatch waits instead of paying twice (the ledger also refuses
# an identical request that is in flight or already paid).
concurrency:
  group: profitdecoded-produce-${{ inputs.topic || 'auto' }}-${{ inputs.format || 'short' }}
  cancel-in-progress: false

jobs:
  produce:
    if: github.event_name == 'workflow_dispatch' || vars.PD_AUTO_SCHEDULE == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      # persist-credentials: false: the write-capable token is not left in .git/config for later steps (npm/pip
      # install scripts); only the produce, preflight and ledger steps receive it explicitly.
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-python@v5
        if: inputs.through != 'script' && inputs.through != 'preflight'
        with:
          python-version: '3.12'
      - name: System packages (ffmpeg, ImageMagick, fonts)
        if: inputs.through != 'script' && inputs.through != 'preflight'
        run: bash scripts/ci-apt.sh ffmpeg imagemagick fonts-dejavu-core fonts-liberation
      - run: npm install --no-audit --no-fund
      - run: pip install --quiet kokoro-onnx soundfile
        if: inputs.through != 'script' && inputs.through != 'preflight'
      - name: Kokoro model cache
        if: inputs.through != 'script' && inputs.through != 'preflight'
        id: kokoro-cache
        uses: actions/cache@v4
        with:
          path: kokoro-model
          key: kokoro-onnx-model-files-v1.0
      - name: Kokoro model files (download once, then cached)
        if: inputs.through != 'script' && inputs.through != 'preflight' && steps.kokoro-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p kokoro-model
          curl -fL --retry 3 -o kokoro-model/kokoro-v1.0.onnx https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/kokoro-v1.0.onnx
          curl -fL --retry 3 -o kokoro-model/voices-v1.0.bin https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/voices-v1.0.bin
      - name: Check the selected providers' API key secrets exist (values are never printed)
        env:
          PROVIDER: ${{ inputs.provider || 'groq' }}
          CRITIC: ${{ inputs.critic || 'same' }}
          ANTHROPIC_KEY: ${{ secrets.PD_ANTHROPIC_API_KEY }}
          GROQ_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          for n in GROQ_KEY GEMINI_KEY ANTHROPIC_KEY; do if [ -n "${!n}" ]; then echo "$n: present (value not shown)"; else echo "$n: missing"; fi; done
          if [ "$PROVIDER" = "groq" ] && [ -z "$GROQ_KEY" ]; then echo "::error::Repository secret GROQ_API_KEY is not set"; exit 1; fi
          if [ "$PROVIDER" = "anthropic" ] && [ -z "$ANTHROPIC_KEY" ]; then echo "::error::Repository secret PD_ANTHROPIC_API_KEY is not set"; exit 1; fi
          if [ "$CRITIC" = "gemini" ] && [ -z "$GEMINI_KEY" ]; then echo "::error::Repository secret GEMINI_API_KEY is not set"; exit 1; fi
      - name: Preflight (no paid call; paid runs stop here unless the reviewer, key, ledger and policy are ready)
        if: inputs.through == 'preflight' || inputs.provider == 'anthropic'
        env:
          PROVIDER: ${{ inputs.provider || 'groq' }}
          THROUGH: ${{ inputs.through || 'assess' }}
          TOPIC: ${{ inputs.topic }}
          FORMAT: ${{ inputs.format || 'short' }}
          POOL: ${{ inputs.budget_pool || 'script' }}
          MAX_USD: ${{ inputs.max_usd || '0' }}
          ANTHROPIC_API_KEY: ${{ secrets.PD_ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PD_GEMINI_MODEL: ${{ vars.PD_GEMINI_MODEL || 'gemini-3.8-flash' }}
          PD_BUDGET_TOKEN: ${{ github.token }}
          PD_AUTO_MODEL: ${{ inputs.model || 'claude-opus-5-5' }}
          PD_SCRIPT_VERSION: ${{ inputs.script_version || vars.PD_SCRIPT_VERSION || 'v1' }}
        run: |
          ARGS=(--format "$FORMAT" --pool "$POOL" --max-usd "$MAX_USD")
          if [ -n "$TOPIC" ]; then ARGS+=(--topic "$TOPIC"); fi
          # A real paid run also probes the Gemini daily quota with ONE minimal request before any paid writing.
          # A dry preflight for an Anthropic run checks the same paid conditions (policy, approval, headroom, key) without the probe.
          if [ "$PROVIDER" = "anthropic" ] && [ "$THROUGH" != "preflight" ]; then node profitdecoded.js preflight --paid --probe-gemini "${ARGS[@]}"
          elif [ "$PROVIDER" = "anthropic" ]; then node profitdecoded.js preflight --paid "${ARGS[@]}"
          else node profitdecoded.js preflight "${ARGS[@]}"; fi
      - run: mkdir -p channels/profitdecoded/state/story-cache
        if: inputs.through != 'preflight'
      - name: Story stage cache (resume an interrupted run)
        if: inputs.through != 'preflight'
        uses: actions/cache/restore@v4
        with:
          path: channels/profitdecoded/state/story-cache
          key: pd-story-${{ inputs.topic || 'auto' }}-${{ inputs.format || 'short' }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: pd-story-${{ inputs.topic || 'auto' }}-${{ inputs.format || 'short' }}-
      - name: Autonomous production (dry run, no upload)
        id: produce
        if: inputs.through != 'preflight'
        env:
          PD_AUTO_PROVIDER: ${{ inputs.provider || 'groq' }}
          ANTHROPIC_API_KEY: ${{ secrets.PD_ANTHROPIC_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PD_GEMINI_MODEL: ${{ vars.PD_GEMINI_MODEL || 'gemini-3.8-flash' }}
          PD_AUTO_MAX_TOKENS: ${{ inputs.token_guard || '400000' }}
          CRITIC: ${{ inputs.critic || 'same' }}
          THROUGH: ${{ inputs.through || 'assess' }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          SERPER_API_KEY: ${{ secrets.SERPER_API_KEY }}
          EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
          PD_FETCH_CONTACT: ${{ vars.PD_FETCH_CONTACT || secrets.PD_FETCH_CONTACT || format('https://github.com/{0}', github.repository) }}
          PD_TTS_PROVIDER: kokoro
          PD_KOKORO_MODEL: ${{ github.workspace }}/kokoro-model/kokoro-v1.0.onnx
          PD_KOKORO_VOICES: ${{ github.workspace }}/kokoro-model/voices-v1.0.bin
          PD_KOKORO_PYTHON: python
          TOPIC: ${{ inputs.topic }}
          FORMAT: ${{ inputs.format || 'short' }}
          MAX_USD: ${{ inputs.max_usd || '0' }}
          PD_BUDGET_POOL: ${{ inputs.budget_pool || 'script' }}
          PD_BUDGET_TOKEN: ${{ github.token }}
          PD_SCRIPT_VERSION: ${{ inputs.script_version || vars.PD_SCRIPT_VERSION || 'v1' }}
          PD_AUTO_MODEL: ${{ inputs.model || 'claude-opus-5-5' }}
        run: |
          if [ "$CRITIC" = "gemini" ]; then export PD_STORY_PROVIDERS="plan=$PD_AUTO_PROVIDER,draft=$PD_AUTO_PROVIDER,rewrite=$PD_AUTO_PROVIDER,critique=gemini"; echo "stage providers: $PD_STORY_PROVIDERS"; fi
          if [ -n "$TOPIC" ]; then
            node scripts/profitdecoded/auto-produce.js --topic "$TOPIC" --format "$FORMAT" --max-usd "$MAX_USD" --through "$THROUGH"
          else
            node scripts/profitdecoded/auto-produce.js --format "$FORMAT" --max-usd "$MAX_USD" --through "$THROUGH"
          fi
      # The single-use paid approval is closed as soon as the paid production step has run, whatever its outcome
      # (success, failure, pause, cancellation). Re-runs and resumes then need a new, reviewed approval.
      - name: Close the paid approval (single use)
        if: always() && inputs.provider == 'anthropic' && inputs.through != 'preflight' && steps.produce.outcome != 'skipped' && steps.produce.outcome != ''
        env:
          PD_BUDGET_TOKEN: ${{ github.token }}
          OUTCOME: ${{ steps.produce.outcome }}
        run: |
          node profitdecoded.js budget close --reason "run ${{ github.run_id }}/${{ github.run_attempt }} production step ended: $OUTCOME"
      # run_attempt in the key: a GitHub "re-run" keeps run_id, and a cache key can be written only once.
      - name: Save story stage cache (also after a pause or failure)
        if: always() && inputs.through != 'preflight'
        uses: actions/cache/save@v4
        with:
          path: channels/profitdecoded/state/story-cache
          key: pd-story-${{ inputs.topic || 'auto' }}-${{ inputs.format || 'short' }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Paid budget after the run (ledger status and costs)
        if: always() && inputs.provider == 'anthropic' && inputs.through != 'preflight'
        env:
          PD_BUDGET_TOKEN: ${{ github.token }}
        run: |
          node profitdecoded.js budget status || true
          node profitdecoded.js costs || true
      - name: Keep review artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: profitdecoded-auto-production
          path: |
            channels/profitdecoded/auto/**/bundle.json
            channels/profitdecoded/auto/**/out/video.mp4
            channels/profitdecoded/auto/**/out/review-report.md
            channels/profitdecoded/auto/**/out/assessment.json
            channels/profitdecoded/auto/**/out/narration-only.wav
            channels/profitdecoded/auto/**/out/captions.srt
            channels/profitdecoded/research/*.json
            channels/profitdecoded/state/auto-runs.json
            channels/profitdecoded/state/auto-debug/**
            channels/profitdecoded/auto/**/story/**
            channels/profitdecoded/state/story-cache/**
          if-no-files-found: warn
          retention-days: 14
