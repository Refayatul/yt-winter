name: BTO source discovery test
on:
  pull_request:
    paths:
      - 'scripts/bto-source-discovery.js'
      - 'scripts/bto-research-fallback.js'
      - 'scripts/bto-research-fallback-hook.js'
      - 'scripts/bto-research-production-adapter.js'
      - 'test/**'
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node test/run-bto-discovery-tests.js
