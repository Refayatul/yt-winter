name: BTO source discovery test
on:
  pull_request:
    paths:
      - 'scripts/bto-source-discovery.js'
      - 'scripts/bto-research-fallback.js'
      - 'test/bto-source-discovery.test.js'
      - 'test/bto-discovery-regression.test.js'
      - 'test/bto-research-fallback.test.js'
      - 'test/bto-fallback-safety.test.js'
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node test/bto-source-discovery.test.js
      - run: node test/bto-discovery-regression.test.js
      - run: node test/bto-research-fallback.test.js
      - run: node test/bto-fallback-safety.test.js
