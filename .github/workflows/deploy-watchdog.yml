name: Deploy independent production watchdog

# mode=preflight (the default) is read-only: it checks the account's Cron Trigger capacity, the
# repository flags and the currently deployed watchdog, and changes nothing in Cloudflare.
# mode=deploy runs the same preflight first and deploys only when it passes.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: preflight = read-only checks; deploy = preflight, then deploy and verify
        type: choice
        options: [preflight, deploy]
        default: preflight
      confirm_flags_enabled:
        description: Deploy even though CF_PRODUCTION_DISPATCH or CF_PUBLICATION_DISPATCH is '1'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      WRANGLER_VERSION: '4.45.3'
      WORKER_NAME: youtube-production-watchdog
      WATCHDOG_CRON: '35 16 * * *'
      # Every Cron Trigger the Worker must have (src/index.mjs SCHEDULE, wrangler.toml [triggers]).
      DISPATCH_CRONS: '5 7 * * *|5 13 * * *|35 16 * * *|5 19 * * *'
      PRODUCTION_DEADLINE_UTC: ${{ vars.PRODUCTION_DEADLINE_UTC || '16:30' }}
      # Workers Free allows 5 Cron Triggers per account, Paid 250. The plan cannot be read with a
      # Workers-scoped token, so the Free limit is assumed unless the owner sets CF_WORKERS_PLAN=paid.
      CRON_LIMIT: ${{ vars.CF_WORKERS_PLAN == 'paid' && '250' || '5' }}
    defaults:
      run:
        working-directory: ops/production-watchdog-worker
    steps:
      - name: Verify required deployment secrets exist
        working-directory: .
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          WATCHDOG_GITHUB_TOKEN: ${{ secrets.WATCHDOG_GITHUB_TOKEN }}
        run: |
          missing=0
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error title=Missing deployment secret::CLOUDFLARE_ACCOUNT_ID is required (Cloudflare account ID)."
            missing=1
          fi
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error title=Missing deployment secret::CLOUDFLARE_API_TOKEN is required (Workers Scripts: Edit)."
            missing=1
          fi
          if [ -z "$WATCHDOG_GITHUB_TOKEN" ]; then
            echo "::error title=Missing deployment secret::WATCHDOG_GITHUB_TOKEN is required (fine-grained token for this repository with Contents: Read and write)."
            missing=1
          fi
          test "$missing" = "0" || exit 2

      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Verify cron is five minutes after the SLA deadline
        run: |
          node - <<'NODE'
          const deadline = process.env.PRODUCTION_DEADLINE_UTC;
          const cron = process.env.WATCHDOG_CRON;
          if (!/^(?:[01]\d|2[0-3]):[0-5]\d$/.test(deadline)) throw new Error(`Invalid PRODUCTION_DEADLINE_UTC: ${deadline}`);
          const parts = cron.trim().split(/\s+/);
          if (parts.length !== 5 || !/^\d+$/.test(parts[0]) || !/^\d+$/.test(parts[1])) throw new Error(`Unsupported WATCHDOG_CRON: ${cron}`);
          const [hour, minute] = deadline.split(":").map(Number);
          const delay = Number(parts[1]) * 60 + Number(parts[0]) - (hour * 60 + minute);
          if (delay !== 5) throw new Error(`WATCHDOG_CRON ${cron} must be exactly five minutes after deadline ${deadline} UTC; got ${delay} minutes`);
          console.log(`SLA timing verified: ${deadline} UTC deadline -> ${cron} (five-minute delay).`);
          // The full trigger set must match wrangler.toml, include the SLA watchdog cron and fit the
          // Workers Free account limit of 5 Cron Triggers.
          const crons = process.env.DISPATCH_CRONS.split("|").map((value) => value.trim()).filter(Boolean);
          const toml = require("fs").readFileSync("wrangler.toml", "utf8");
          const declared = JSON.parse(toml.match(/^crons\s*=\s*(\[.*\])\s*$/m)[1]);
          if (JSON.stringify([...crons].sort()) !== JSON.stringify([...declared].sort())) throw new Error(`DISPATCH_CRONS ${JSON.stringify(crons)} does not match wrangler.toml ${JSON.stringify(declared)}`);
          if (!crons.includes(cron)) throw new Error(`the SLA watchdog cron ${cron} is missing from DISPATCH_CRONS`);
          if (crons.length > 5) throw new Error(`${crons.length} cron triggers exceed the Workers Free account limit of 5`);
          console.log(`Cron triggers verified: ${crons.join(", ")}`);
          NODE

      - name: Refuse when dispatch flags are already enabled
        env:
          PRODUCTION_FLAG: ${{ vars.CF_PRODUCTION_DISPATCH }}
          PUBLICATION_FLAG: ${{ vars.CF_PUBLICATION_DISPATCH }}
          CONFIRMED: ${{ inputs.confirm_flags_enabled }}
        run: |
          echo "CF_PRODUCTION_DISPATCH=${PRODUCTION_FLAG:-unset} · CF_PUBLICATION_DISPATCH=${PUBLICATION_FLAG:-unset}"
          if [ "$PRODUCTION_FLAG" = "1" ] || [ "$PUBLICATION_FLAG" = "1" ]; then
            if [ "$CONFIRMED" = "true" ]; then echo "::warning::Dispatch flags are enabled and the owner confirmed it."; exit 0; fi
            echo "::error::A dispatch flag is enabled. The first deployment must run with both flags unset (or set confirm_flags_enabled)."
            exit 7
          fi

      # Read-only. Counts every Cron Trigger on the account (all Workers) and refuses when this
      # Worker's triggers would not fit; records the currently deployed watchdog as rollback evidence.
      - name: Preflight — account cron capacity and current watchdog
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -o pipefail
          EVIDENCE="$RUNNER_TEMP/watchdog-deployment-evidence/preflight"
          mkdir -p "$EVIDENCE"
          api() {
            curl --fail --silent --show-error -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/$1"
          }
          api "workers/scripts" > "$EVIDENCE/scripts.json" || {
            echo "::error::Cannot list the account's Workers; the API token needs Workers Scripts read access."
            exit 8
          }
          jq -e '.success == true' "$EVIDENCE/scripts.json" >/dev/null
          echo '[]' > "$EVIDENCE/crons.json"
          for script in $(jq -r '.result[].id' "$EVIDENCE/scripts.json"); do
            api "workers/scripts/$script/schedules" > "$EVIDENCE/schedules-$script.json" || {
              echo "::error::Cannot read the Cron Triggers of Worker $script; capacity cannot be verified."
              exit 8
            }
            jq --arg s "$script" '. + [ (input.result.schedules // [])[] | {script: $s, cron} ]' \
              "$EVIDENCE/crons.json" "$EVIDENCE/schedules-$script.json" > "$EVIDENCE/crons.next" && mv "$EVIDENCE/crons.next" "$EVIDENCE/crons.json"
          done
          OTHER=$(jq --arg w "$WORKER_NAME" '[.[] | select(.script != $w)] | length' "$EVIDENCE/crons.json")
          CURRENT=$(jq -c --arg w "$WORKER_NAME" '[.[] | select(.script == $w) | .cron]' "$EVIDENCE/crons.json")
          NEEDED=$(awk -F'|' '{print NF}' <<< "$DISPATCH_CRONS")
          WORKERS=$(jq '.result | length' "$EVIDENCE/scripts.json")
          {
            echo "## Watchdog preflight"
            echo ""
            echo "| Check | Value |"
            echo "|---|---|"
            echo "| Workers on the account | $WORKERS |"
            echo "| Cron Triggers on other Workers | $OTHER |"
            echo "| $WORKER_NAME triggers now | \`$CURRENT\` |"
            echo "| Triggers after deploy | $NEEDED |"
            echo "| Account limit assumed | $CRON_LIMIT (set CF_WORKERS_PLAN=paid only for a Workers Paid account) |"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ $((OTHER + NEEDED)) -gt "$CRON_LIMIT" ]; then
            echo "::error::Not enough Cron Trigger capacity: $OTHER on other Workers + $NEEDED needed > limit $CRON_LIMIT. Nothing was changed."
            exit 9
          fi
          echo "Capacity OK: $OTHER + $NEEDED <= $CRON_LIMIT"
          echo "$CURRENT" | jq -e --arg cron "$WATCHDOG_CRON" 'index($cron) != null' >/dev/null \
            || echo "::warning::The deployed watchdog does not currently have the $WATCHDOG_CRON trigger."
          npx --yes "wrangler@$WRANGLER_VERSION" deployments list --json > "$EVIDENCE/deployments-before.json" \
            || echo "::warning::wrangler deployments list failed (evidence only)."
          SUBDOMAIN=$(api "workers/subdomain" | jq -er 'select(.success == true) | .result.subdomain') || SUBDOMAIN=""
          if [ -n "$SUBDOMAIN" ] && curl --fail --silent --show-error "https://$WORKER_NAME.$SUBDOMAIN.workers.dev/health" > "$EVIDENCE/health-before.json"; then
            jq '{ok,tokenConfigured,cron,deadlineUtc,version,commit,signatureVersion}' "$EVIDENCE/health-before.json"
            {
              echo "| Deployed version | $(jq -r '.version // "?"' "$EVIDENCE/health-before.json") |"
              echo "| Deployed commit | $(jq -r '.commit // "?"' "$EVIDENCE/health-before.json") |"
              echo "| Token configured | $(jq -r '.tokenConfigured' "$EVIDENCE/health-before.json") |"
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::The current watchdog /health endpoint is not reachable."
          fi

      - name: Store GitHub dispatch token in the Worker
        if: inputs.mode == 'deploy'
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          WATCHDOG_GITHUB_TOKEN: ${{ secrets.WATCHDOG_GITHUB_TOKEN }}
        run: printf '%s' "$WATCHDOG_GITHUB_TOKEN" | npx --yes "wrangler@$WRANGLER_VERSION" secret put WATCHDOG_GITHUB_TOKEN

      - name: Deploy Worker and independent cron trigger
        if: inputs.mode == 'deploy'
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/watchdog-deployment-evidence"
          WATCHDOG_VERSION="github-actions-${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}"
          npx --yes "wrangler@$WRANGLER_VERSION" deploy \
            --var "GITHUB_REPOSITORY:$GITHUB_REPOSITORY" \
            --var "PRODUCTION_DEADLINE_UTC:$PRODUCTION_DEADLINE_UTC" \
            --var "WATCHDOG_CRON:$WATCHDOG_CRON" \
            --var "DISPATCH_CRONS:$DISPATCH_CRONS" \
            --var "WATCHDOG_VERSION:$WATCHDOG_VERSION" \
            --var "WATCHDOG_COMMIT:$GITHUB_SHA" \
            | tee "$RUNNER_TEMP/watchdog-deployment-evidence/deploy.log"

      - name: Verify deployed version, cron, secret and health endpoint
        if: inputs.mode == 'deploy'
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          npx --yes "wrangler@$WRANGLER_VERSION" deployments list --json > "$RUNNER_TEMP/watchdog-deployment-evidence/deployments.json"
          jq -e 'type == "array" and length > 0' "$RUNNER_TEMP/watchdog-deployment-evidence/deployments.json" >/dev/null

          curl --fail --silent --show-error \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$WORKER_NAME/schedules" \
            > "$RUNNER_TEMP/watchdog-deployment-evidence/schedules.json"
          jq -e --arg cron "$WATCHDOG_CRON" '.success == true and any(.result.schedules[]; .cron == $cron)' \
            "$RUNNER_TEMP/watchdog-deployment-evidence/schedules.json" >/dev/null || {
              echo "::error::Cloudflare did not report the expected cron trigger: $WATCHDOG_CRON"
              exit 3
            }
          IFS='|' read -r -a EXPECTED_CRONS <<< "$DISPATCH_CRONS"
          for expected in "${EXPECTED_CRONS[@]}"; do
            jq -e --arg cron "$expected" 'any(.result.schedules[]; .cron == $cron)' \
              "$RUNNER_TEMP/watchdog-deployment-evidence/schedules.json" >/dev/null || {
                echo "::error::Cloudflare did not report the expected cron trigger: $expected"
                exit 3
              }
          done

          curl --fail --silent --show-error \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$WORKER_NAME/subdomain" \
            > "$RUNNER_TEMP/watchdog-deployment-evidence/script-subdomain.json"
          jq -e '.success == true and .result.enabled == true' \
            "$RUNNER_TEMP/watchdog-deployment-evidence/script-subdomain.json" >/dev/null || {
              echo "::error::Worker is not enabled on its workers.dev subdomain."
              exit 4
            }

          curl --fail --silent --show-error \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain" \
            > "$RUNNER_TEMP/watchdog-deployment-evidence/subdomain.json"
          SUBDOMAIN=$(jq -er 'select(.success == true) | .result.subdomain' "$RUNNER_TEMP/watchdog-deployment-evidence/subdomain.json")
          HEALTH_URL="https://$WORKER_NAME.$SUBDOMAIN.workers.dev/health"

          for attempt in 1 2 3 4 5; do
            if curl --fail --silent --show-error "$HEALTH_URL" > "$RUNNER_TEMP/watchdog-deployment-evidence/health.json"; then break; fi
            if [ "$attempt" = "5" ]; then echo "::error::Worker health endpoint did not become reachable: $HEALTH_URL"; exit 5; fi
            sleep $((attempt * 2))
          done
          jq -e \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg cron "$WATCHDOG_CRON" \
            --arg deadline "$PRODUCTION_DEADLINE_UTC" \
            --arg commit "$GITHUB_SHA" \
            --arg crons "$DISPATCH_CRONS" \
            '.ok == true and .tokenConfigured == true and .repository == $repository and .cron == $cron and .deadlineUtc == $deadline and .commit == $commit and .signatureVersion == "v1" and ([.schedule[].cron] | sort) == ($crons | split("|") | sort)' \
            "$RUNNER_TEMP/watchdog-deployment-evidence/health.json" >/dev/null || {
              echo "::error::Worker /health metadata does not match this deployment."
              jq '{ok,tokenConfigured,repository,cron,deadlineUtc,version,commit}' "$RUNNER_TEMP/watchdog-deployment-evidence/health.json"
              exit 6
            }

          jq -n \
            --arg deployedAt "$(date -u +%FT%TZ)" \
            --arg healthUrl "$HEALTH_URL" \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg cron "$WATCHDOG_CRON" \
            --arg deadline "$PRODUCTION_DEADLINE_UTC" \
            --arg commit "$GITHUB_SHA" \
            '{ok:true,deployedAt:$deployedAt,healthUrl:$healthUrl,repository:$repository,cron:$cron,deadlineUtc:$deadline,commit:$commit}' \
            > "$RUNNER_TEMP/watchdog-deployment-evidence/summary.json"
          {
            echo "## Independent watchdog deployment verified"
            echo ""
            echo "- Health: $HEALTH_URL"
            echo "- Repository: $GITHUB_REPOSITORY"
            echo "- SLA deadline: $PRODUCTION_DEADLINE_UTC UTC"
            echo "- SLA watchdog cron: $WATCHDOG_CRON"
            echo "- All cron triggers: $DISPATCH_CRONS"
            echo "- Commit: $GITHUB_SHA"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload deployment evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: watchdog-deployment-evidence
          path: ${{ runner.temp }}/watchdog-deployment-evidence
          if-no-files-found: ignore
          retention-days: 90
