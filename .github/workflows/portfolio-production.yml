name: Multi-channel portfolio production

# All channels run in one serialized portfolio lane so maxConcurrentRenders /
# maxConcurrentUploads=1 is physically enforced. Every channel step is failure
# isolated; one failed identity cannot stop any other channel.
#
# Shorts production slots (Europe/Istanbul, UTC+3; each channel's config.json
# publishingCadence.shorts.productionTime): Failure Reconstructed 09:00,
# ImpossibleBrief 09:30, CriticalThread 10:00, The Hidden Logic of Things 10:30.
# Every quality-approved uploaded Short is scheduled by youtube-yukle.js to go
# public at 21:00 Europe/Istanbul on its production date. Scheduled runs enable
# upload for all four channels; BLOCK/REVIEW still fail closed and never publish.
# Eligibility is one Short per channel per Istanbul calendar day, so the hourly
# retries below only produce for a channel whose slot has passed and whose day
# is still empty.
#
# Primary clock: the Cloudflare Worker (ops/production-watchdog-worker) sends a signed
# repository_dispatch "shorts-production" at 07:05 and 13:05 UTC. It acts like a scheduled run only
# when scripts/verify-dispatch.js accepts it AND the repository variable CF_PRODUCTION_DISPATCH is
# '1' (unset by default: the event is acknowledged and nothing is produced). The GitHub crons below
# stay as the backup; every run is idempotent (one Short per channel and target day, shared
# concurrency group), so a cron run after a dispatched run finds the day taken and does nothing.
on:
  repository_dispatch:
    types: [shorts-production]
  schedule:
    - cron: '0 6 * * *'
    - cron: '30 6 * * *'
    - cron: '0 7 * * *'
    - cron: '30 7 * * *'
    - cron: '23 7 * * *'
    - cron: '23 8 * * *'
    - cron: '23 9 * * *'
    - cron: '23 10 * * *'
    - cron: '23 11 * * *'
    - cron: '23 12 * * *'
    - cron: '23 13 * * *'
    - cron: '23 14 * * *'
    - cron: '23 15 * * *'
    - cron: '23 16 * * *'
  workflow_dispatch:
    inputs:
      channel:
        description: Channel to run
        type: choice
        options: [all, both, failure-reconstructed, impossible-brief, critical-thread, behind-the-ordinary]
        default: all
      dry_run:
        description: Render and validate without upload
        type: boolean
        default: true

concurrency:
  group: portfolio-production
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  # Schedule and manual runs pass straight through. A repository_dispatch must carry a valid
  # Cloudflare signature and be explicitly enabled (CF_PRODUCTION_DISPATCH=1).
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.decide.outputs.run }}
      correlation_id: ${{ steps.verify.outputs.correlation_id }}
    steps:
      - uses: actions/checkout@v4
        if: github.event_name == 'repository_dispatch'
        with:
          ref: ${{ github.ref_name }}
          sparse-checkout: scripts/verify-dispatch.js
          sparse-checkout-cone-mode: false
      - id: verify
        name: Verify Cloudflare dispatch signature
        if: github.event_name == 'repository_dispatch'
        env:
          DISPATCH_SIGNING_KEY: ${{ secrets.WATCHDOG_GITHUB_TOKEN }}
        run: node scripts/verify-dispatch.js --event shorts-production --max-age-minutes 360
      - id: decide
        name: Decide whether this run produces
        env:
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_ENABLED: ${{ vars.CF_PRODUCTION_DISPATCH }}
        run: |
          if [ "$EVENT_NAME" != "repository_dispatch" ]; then echo "run=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          if [ "$DISPATCH_ENABLED" = "1" ]; then echo "run=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          echo "::notice::Verified Cloudflare shorts-production dispatch; CF_PRODUCTION_DISPATCH is not '1', so nothing is produced."
          echo "run=false" >> "$GITHUB_OUTPUT"

  portfolio:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      DISPATCH_CORRELATION_ID: ${{ needs.gate.outputs.correlation_id }}
      FR_YT_CLIENT_ID: ${{ secrets.FR_YT_CLIENT_ID }}
      FR_YT_CLIENT_SECRET: ${{ secrets.FR_YT_CLIENT_SECRET }}
      FR_YT_REFRESH_TOKEN: ${{ secrets.FR_YT_REFRESH_TOKEN }}
      FR_YT_CHANNEL_ID: ${{ vars.FR_YT_CHANNEL_ID }}
      YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
      YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
      YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
      YT_CHANNEL_ID: ${{ vars.FR_YT_CHANNEL_ID }}
      IB_CLIENT_ID: ${{ secrets.IB_CLIENT_ID }}
      IB_CLIENT_SECRET: ${{ secrets.IB_CLIENT_SECRET }}
      IB_YT_REFRESH_TOKEN: ${{ secrets.IB_YT_REFRESH_TOKEN }}
      IB_YT_CHANNEL_ID: ${{ vars.IB_YT_CHANNEL_ID }}
      CT_CLIENT_ID: ${{ secrets.CT_CLIENT_ID }}
      CT_CLIENT_SECRET: ${{ secrets.CT_CLIENT_SECRET }}
      CT_YT_REFRESH_TOKEN: ${{ secrets.CT_YT_REFRESH_TOKEN }}
      CT_YT_CHANNEL_ID: ${{ vars.CT_YT_CHANNEL_ID }}
      BTO_YT_CLIENT_ID: ${{ secrets.BTO_YT_CLIENT_ID }}
      BTO_YT_CLIENT_SECRET: ${{ secrets.BTO_YT_CLIENT_SECRET }}
      BTO_YT_REFRESH_TOKEN: ${{ secrets.BTO_YT_REFRESH_TOKEN }}
      BTO_YT_CHANNEL_ID: ${{ vars.BTO_YT_CHANNEL_ID }}
      PEXELS_KEY: ${{ secrets.PEXELS_KEY }}
      SHORTS_FONT: DejaVu Sans
      SHORTS_KOKORO_DIR: ${{ github.workspace }}/kokoro-model
      SHORTS_KOKORO_PYTHON: python
      # Manual dry runs may preview a channel's unapproved fallback voice (never uploaded: PUBLISH=0
      # and youtube-yukle.js refuses unapproved fallback narration). Scheduled runs never set it.
      SHORTS_TTS_FALLBACK: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && 'preview' || '' }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Runtime dependencies
        run: |
          bash scripts/ci-apt.sh --no-install-recommends ffmpeg fonts-dejavu-core fonts-liberation python3-pil
          npm install --no-audit --no-fund
      # Offline narration fallback (lib/shorts-tts.js). Installing it does not enable it: a channel
      # uses it only when config.voice.fallback.approved is true (owner-approved voice).
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # Restore and save are separate so only verified files are ever cached: the save step runs
      # only after scripts/kokoro-model.sh checked every file against its pinned sha256.
      - name: Kokoro model cache (restore)
        id: kokoro-cache
        uses: actions/cache/restore@v4
        with:
          path: kokoro-model
          key: kokoro-onnx-model-files-v1.0
      - name: Offline fallback voice (Kokoro-82M, pinned)
        id: kokoro
        continue-on-error: true
        run: |
          pip install --quiet kokoro-onnx==0.6.1 soundfile
          bash scripts/kokoro-model.sh kokoro-model
      - name: Kokoro model cache (save verified files)
        if: steps.kokoro.outcome == 'success' && steps.kokoro-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: kokoro-model
          key: kokoro-onnx-model-files-v1.0
      - name: Portfolio plan
        run: node portfolio-scheduler.js --enqueue

      - name: Failure Reconstructed Short
        if: (github.event_name == 'schedule' || github.event_name == 'repository_dispatch') || inputs.channel == 'all' || inputs.channel == 'both' || inputs.channel == 'failure-reconstructed'
        continue-on-error: true
        env:
          PUBLISH: ${{ (github.event_name == 'schedule' || github.event_name == 'repository_dispatch') && '1' || vars.FR_PUBLISH || vars.PUBLISH }}
          PRODUCTION_RESULT_PATH: ${{ runner.temp }}/fr-production-result.json
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then export PUBLISH=0; fi
          node saglik.js --channel failure-reconstructed || true
          node shorts-sira.js --channel failure-reconstructed

      - name: ImpossibleBrief Short
        if: ${{ always() && ((github.event_name == 'schedule' || github.event_name == 'repository_dispatch') || inputs.channel == 'all' || inputs.channel == 'both' || inputs.channel == 'impossible-brief') }}
        continue-on-error: true
        env:
          PUBLISH: ${{ (github.event_name == 'schedule' || github.event_name == 'repository_dispatch') && '1' || vars.IB_PUBLISH }}
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then export PUBLISH=0; fi
          node saglik.js --channel impossible-brief || true
          node shorts-sira.js --channel impossible-brief

      - name: CriticalThread Short
        if: ${{ always() && ((github.event_name == 'schedule' || github.event_name == 'repository_dispatch') || inputs.channel == 'all' || inputs.channel == 'critical-thread') }}
        continue-on-error: true
        env:
          PUBLISH: ${{ (github.event_name == 'schedule' || github.event_name == 'repository_dispatch') && '1' || vars.CT_PUBLISH }}
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then export PUBLISH=0; fi
          node saglik.js --channel critical-thread || true
          node shorts-sira.js --channel critical-thread

      # Inactive channel (config/channels.json enabled:false): only an explicit manual run produces it.
      - name: The Hidden Logic of Things Short
        if: ${{ always() && github.event_name == 'workflow_dispatch' && inputs.channel == 'behind-the-ordinary' }}
        continue-on-error: true
        env:
          # The Hidden Logic of Things publishes only when BTO_PUBLISH=1, scheduled or not.
          PUBLISH: ${{ vars.BTO_PUBLISH == '1' && '1' || '0' }}
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then export PUBLISH=0; fi
          node saglik.js --channel behind-the-ordinary || true
          node shorts-sira.js --channel behind-the-ordinary

      # Weekly long-form lane (after every Short step, so it can never delay or
      # starve Shorts). Idempotent per ISO week: on most hourly runs it only
      # reports "not due". A QUALITY_BLOCKED / REVIEW_REQUIRED cycle is expected
      # behaviour and exits 0. Render/upload additionally require the channel's
      # growth-engine longform.render.enabled AND <PREFIX>_LONGFORM_PUBLISH=1;
      # the LLM writer requires an explicit provider plus that provider's key.
      - name: Weekly long-form lane (quality over cadence)
        if: always()
        continue-on-error: true
        timeout-minutes: 90
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_MODEL: ${{ vars.ANTHROPIC_MODEL }}
          LONGFORM_LLM: ${{ vars.LONGFORM_LLM }}
          LONGFORM_LLM_PROVIDER: ${{ vars.LONGFORM_LLM_PROVIDER }}
          LONGFORM_LLM_FALLBACK_PROVIDER: ${{ vars.LONGFORM_LLM_FALLBACK_PROVIDER }}
          LONGFORM_LLM_MAX_ATTEMPTS: ${{ vars.LONGFORM_LLM_MAX_ATTEMPTS }}
          LONGFORM_LLM_MAX_RETRY_MS: ${{ vars.LONGFORM_LLM_MAX_RETRY_MS }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL: ${{ vars.GROQ_MODEL }}
          FR_LONGFORM_PUBLISH: ${{ vars.FR_LONGFORM_PUBLISH }}
          IB_LONGFORM_PUBLISH: ${{ vars.IB_LONGFORM_PUBLISH }}
          CT_LONGFORM_PUBLISH: ${{ vars.CT_LONGFORM_PUBLISH }}
          BTO_LONGFORM_PUBLISH: ${{ vars.BTO_LONGFORM_PUBLISH }}
        run: |
          DRY=""
          if [ "${{ inputs.dry_run }}" = "true" ]; then DRY="--dry-run"; fi
          for CHANNEL in failure-reconstructed impossible-brief critical-thread behind-the-ordinary; do
            node growth.js longform --channel "$CHANNEL" $DRY || echo "long-form lane for $CHANNEL failed; Shorts are unaffected."
          done

      - name: Channel-scoped analytics, plans, health and notifications
        if: always()
        env:
          BTO_ACTIVE: ${{ vars.BTO_PUBLISH }}
        run: |
          # The Hidden Logic of Things is inactive: its analytics, plans and notifications run only
          # when BTO_PUBLISH=1 (its OAuth client is not maintained while the channel is paused).
          CHANNELS="failure-reconstructed impossible-brief critical-thread"
          if [ "$BTO_ACTIVE" = "1" ]; then CHANNELS="$CHANNELS behind-the-ordinary"; fi
          for CHANNEL in $CHANNELS; do
            node post-publish-analyzer.js --channel "$CHANNEL" --due || true
            node analytics-sync.js --channel "$CHANNEL" || true
            node channel-plan.js --channel "$CHANNEL" || true
            node library-health.js --channel "$CHANNEL" || true
            if [ "${{ inputs.dry_run }}" != "true" ]; then
              node bildirim.js --channel "$CHANNEL" || true
            else
              echo "Dry run: $CHANNEL notifications skipped."
            fi
          done
          node portfolio-dashboard.js --write
          node growth.js report || true
          node daily-operations-report.js

      # What each active channel actually completed (lib/run-stages.js), written to the run summary
      # and reports/production-outcome.json before the state commit.
      - name: Production outcome (stages)
        if: always()
        run: node scripts/production-outcome.js || true

      - name: Preview artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: portfolio-preview
          path: |
            uretim/*/Videos/*.mp4
            channels/*/state/production/*/Videos/*.mp4
            channels/*/state/production/*/*.mp4
            channels/*/state/production/*/quality-gate.json
            channels/*/state/production/*/validations.json
            channels/*/state/production/*/render.json
            channels/*/state/production/*/visual-attribution.json
          if-no-files-found: ignore
          retention-days: 7

      - name: Commit isolated state
        if: always() && inputs.dry_run != true
        run: |
          git config user.name "portfolio-bot"
          git config user.email "actions@users.noreply.github.com"
          git config merge.json-union.driver "node scripts/git-json-merge.js %O %A %B"
          git add icerik channel analysis analytics experiments migration channels reports || true
          if git diff --cached --quiet; then echo "No state changes."; exit 0; fi
          git commit -m "chore: channel-scoped production state"
          for i in 1 2 3 4 5; do
            git pull --rebase --autostash origin main && git push && exit 0
            sleep $((i * 5))
          done
          exit 1

      # A green run means real output: it fails when an active channel was due and nothing was
      # uploaded (narration outage, no qualified topic, a blocked video, or a crashed step).
      - name: Production verdict
        if: always() && (github.event_name == 'schedule' || github.event_name == 'repository_dispatch')
        run: node scripts/production-outcome.js --verdict
