name: Testler

# Her push / PR'da: JS birim testleri + sozdizimi kontrolu + Python testleri.
# Ag erisimi ve kimlik bilgisi GEREKTIRMEZ (YouTube cagrisi yapilmaz).
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Bagimliliklar
        run: npm install --no-audit --no-fund
      - name: JS testleri + sozdizimi
        run: node --test tests/js/*.test.js
      - name: ImpossibleBrief dry-run packages (no upload)
        run: node e2e-impossible-brief.js
      - name: Two-channel 30-day simulation
        run: node simulate-portfolio.js
      - name: Python testleri
        run: python -m unittest discover -s tests

  # PR'larda UCTAN UCA uretim testi (YOUTUBE'A YUKLEME YOK): GitHub'in Ubuntu + ffmpeg
  # ortaminda gunluk is akisinin aynisi (shorts-sira: kalite kapilari -> goruntu indirme ->
  # render -> denetim -> paket) kosulur, ardindan e2e-kontrol.js 26 maddeyi dogrular
  # (video/ses/denetim/kalite/aciklama/etiket/yukleme metasi/bildirim metni).
  # Kapsam: sabit iki ornek (arsiv + stok) + bu PR'da eklenen/degisen TUM konular (paralel).
  hazirla:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      slugs: ${{ steps.s.outputs.slugs }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: s
        run: |
          DEGISEN=$(git diff --name-only "origin/${{ github.base_ref }}...HEAD" -- 'icerik/konular/*.json' | sed -E 's#icerik/konular/(.*)\.json#\1#')
          SLUGS=$(node -e '
            const fs=require("fs");const bitti=new Set(JSON.parse(fs.readFileSync("icerik/uretilenler.json","utf8")));
            const l=["vesuvius-1944","why-ships-sink",...process.argv[1].split(/\s+/).filter(Boolean)]
              .filter((s,i,a)=>a.indexOf(s)===i && fs.existsSync("icerik/konular/"+s+".json") && (i<2 || !bitti.has(s)));
            console.log(JSON.stringify(l.slice(0,24)));' "$DEGISEN")
          echo "slugs=$SLUGS" >> "$GITHUB_OUTPUT"
          echo "Uctan uca test edilecek: $SLUGS"

  uctan-uca:
    needs: hazirla
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        slug: ${{ fromJson(needs.hazirla.outputs.slugs) }}
    env:
      SHORTS_FONT: 'DejaVu Sans'
      PEXELS_KEY: ${{ secrets.PEXELS_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: ffmpeg + font kur
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core fonts-liberation
      - name: Bagimliliklar
        run: npm install --no-audit --no-fund
      - name: Gunluk is akisi (yuklemesiz) — ${{ matrix.slug }}
        run: |
          if [ -z "$PEXELS_KEY" ] && grep -q '"tur": "stok"' "icerik/konular/${{ matrix.slug }}.json"; then echo "PEXELS_KEY yok (fork PR) — stok konu atlandi"; exit 0; fi
          node shorts-sira.js "${{ matrix.slug }}"
      - name: Uctan uca kontrol (26 madde)
        run: |
          if [ ! -f "uretim/${{ matrix.slug }}/Videos/${{ matrix.slug }}.mp4" ] && [ -z "$PEXELS_KEY" ]; then exit 0; fi
          node e2e-kontrol.js "${{ matrix.slug }}"
      - name: Bildirim metinleri (kuru — GitHub'a yazilmaz)
        run: node bildirim.js --kuru
      - name: Onizlemeyi artifact olarak sakla
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-${{ matrix.slug }}
          path: |
            uretim/${{ matrix.slug }}/Videos/*.mp4
            uretim/${{ matrix.slug }}/Videos/onizleme.jpg
            uretim/${{ matrix.slug }}/Videos/denetim.json
            icerik/paket/${{ matrix.slug }}/description.txt
          if-no-files-found: ignore
          retention-days: 7

  denetim-testi:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: ffmpeg kur
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core
      - name: Denetim testi (gercek ffmpeg)
        run: node --test tests/js/denetim.test.js
