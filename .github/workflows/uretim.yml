name: Shorts uretim (gunluk)

# Her gun bir Shorts uretir (profesyonel tempo: gunde 1) — ama KALITE ONCE:
# shorts-sira.js takvimi (yayin-plani.js) ve kalite kapisini (quality-gate.js)
# uygular; BLOCK olan video yuklenmez. Ardindan yayin sonrasi analiz, sabit
# yorumlar, ic baglanti plani ve deneyler guncellenir; haftada bir (Pazartesi)
# mevcut videolar icin optimizasyon raporlari yenilenir.
# Saat: uretim 07:23-16:23 UTC arasi HER SAAT dener (ilk calisan gunun videosunu
# uretir; sonrakiler takvim adiminda ~20 sn'de durur). Video private yuklenir ve
# config/growth.json > publishing.schedule.hourUTC saatinde (18:00 UTC = 21:00 TR
# = 14:00 ABD dogu) YouTube tarafindan otomatik Public yapilir. Kitlenin ~%93'u
# ABD (analytics, 2026-09-25). Arada kalan saatler inceleme penceresidir;
# GitHub zamanlanmis isleri saatlerce geciktirebildigi icin erken baslatiliyor.
# Her yeni video icin GitHub issue bildirimi acilir (bildirim.js). Elle de
# tetiklenebilir (Run workflow).
on:
  schedule:
    # GitHub zamanlanmis isleri "en iyi caba" ile calistirir: yogun anlarda
    # saatlerce gecikebilir ya da TAMAMEN ATLAYABILIR (olculen: 25 ve 26 Eylul'de
    # 10:00 hic calismadi; 16:00 -> 19:46). Cozum tek saate guvenmemek: 07:23-16:23
    # arasi her saat bir deneme (tam saatten kaydirilmis dakika, cunku :00 en yogun an).
    # Ilk calisan gunun videosunu uretir; kalan denemeler "takvim" adiminda ~20 sn'de
    # durur (yayin-plani.js gunde tek video). 10 denemenin hepsinin atlanmasi pratikte
    # gorulmez; yine de olursa 16:45'te "gun bos gecti" alarmi acilir (yayin-kontrol.yml).
    - cron: '23 7 * * *'
    - cron: '23 8 * * *'
    - cron: '23 9 * * *'
    - cron: '23 10 * * *'
    - cron: '23 11 * * *'
    - cron: '23 12 * * *'
    - cron: '23 13 * * *'
    - cron: '23 14 * * *'
    - cron: '23 15 * * *'
    - cron: '23 16 * * *'
  workflow_dispatch:
    inputs:
      hepsi:
        description: 'Tum uretilmemis konulari uret (yoksa sadece sonraki)'
        type: boolean
        default: false
      kuru:
        description: 'KURU CALISMA: gercek ortamda uctan uca uret + kontrol et, YUKLEME/COMMIT/BILDIRIM YOK'
        type: boolean
        default: false
      slug:
        description: 'Belirli konu (bos = siradaki)'
        type: string
        default: 

# Ayni anda tek uretim; devam eden calisma iptal edilmez.
concurrency:
  group: uretim
  cancel-in-progress: false

permissions:
  contents: write   # uretilenler.json'u geri commit etmek icin
  issues: write     # yeni video bildirimi (bildirim.js)

jobs:
  # UCUZ TAKVIM ADIMI: gunun videosu zaten uretildiyse (ya da vakti gelmediyse)
  # burada durulur. Boylece gunde 9 bosa deneme ~20 sn surer (ffmpeg/npm kurulmaz).
  takvim:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      uygun: ${{ steps.k.outputs.uygun }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - id: k
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "Elle tetiklendi — takvim atlandi."; echo "uygun=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          # Cikis kodu: 0 = vakti geldi, 3 = bugunun videosu zaten var, digeri = BEKLENMEDIK HATA.
          # Beklenmedik hatada uretim ATLANMAZ (yoksa takvim betigindeki bir sorun butun
          # yayini sessizce durdururdu); uretim denenir, orada da hata olursa bildirim gider.
          set +e
          node yayin-plani.js --kontrol short
          KOD=$?
          set -e
          if [ "$KOD" = "3" ]; then
            echo "Bugunun videosu zaten var — uretim atlandi."
            echo "uygun=false" >> "$GITHUB_OUTPUT"
          else
            [ "$KOD" = "0" ] || echo "⚠ yayin-plani beklenmedik cikis kodu $KOD — yine de uretim denenecek"
            echo "uygun=true" >> "$GITHUB_OUTPUT"
          fi

  uret:
    needs: takvim
    if: needs.takvim.outputs.uygun == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      # Yukleme kimlik bilgileri — repo Secrets (yoksa yukleme atlanir).
      YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
      YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
      YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
      # TikTok (istege bagli): yoksa TikTok adimi sessizce atlanir, YouTube etkilenmez.
      TT_CLIENT_KEY: ${{ secrets.TT_CLIENT_KEY }}
      TT_CLIENT_SECRET: ${{ secrets.TT_CLIENT_SECRET }}
      TT_REFRESH_TOKEN: ${{ secrets.TT_REFRESH_TOKEN }}
      # Stok konular (tur: stok) icin Pexels anahtari — yoksa stok-bul.js calismaz.
      PEXELS_KEY: ${{ secrets.PEXELS_KEY }}
      # Yukleme yalnizca PUBLISH=1 iken (repo Variables). Yoksa uretir, yuklemez.
      PUBLISH: ${{ vars.PUBLISH }}
      # Altyazi fontu (ubuntu'da kurulu bir font).
      SHORTS_FONT: 'DejaVu Sans'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: ffmpeg + font kur
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core fonts-liberation

      - name: Bagimliliklar
        run: npm install --no-audit --no-fund

      # Saglik: YouTube yetkisi (bitmek uzere mi?), kapsamlar, Pexels, kutuphane.
      # Sorun varsa bildirim adimi "Sistem uyarisi" issue'su acar; yetki gecersizse
      # shorts-sira hicbir konu harcamadan durur.
      - name: Saglik kontrolu
        run: |
          node saglik.js || echo "saglik kontrolu - yukleme yapilamaz (ayrintilar yukarida)"

      - name: Sonraki Shorts'u uret
        if: github.event.inputs.kuru != 'true'
        run: |
          if [ "${{ github.event.inputs.hepsi }}" = "true" ]; then
            node shorts-sira.js --hepsi
          elif [ -n "${{ github.event.inputs.slug }}" ]; then
            node shorts-sira.js "${{ github.event.inputs.slug }}"
          else
            node shorts-sira.js
          fi

      # KURU CALISMA: gercek secret'lar ve gercek indirme/render ile uctan uca, ama yuklemesiz.
      - name: Kuru calisma (uctan uca, yuklemesiz)
        if: github.event.inputs.kuru == 'true'
        env:
          PUBLISH: '0'
        run: |
          SLUG="${{ github.event.inputs.slug }}"
          if [ -z "$SLUG" ]; then SLUG=$(node -pe 'require("./lib/kutuphane").kuyruk()[0].slug'); fi
          echo "Kuru calisma: $SLUG"
          node shorts-sira.js "$SLUG"
          node e2e-kontrol.js "$SLUG"
          node bildirim.js --kuru

      # TikTok arasini kapat: YouTube'da olup TikTok'ta olmayan en eski videoyu
      # uretip gonderir (gunde bir). Kimlik yoksa ya da ara kapaliysa sessizce gecer.
      # Basarisizlik gunu bozmaz — YouTube yayini zaten tamam.
      - name: TikTok gecmisini kapat (gunde 1 eski video)
        if: always() && github.event.inputs.kuru != 'true'
        run: node tiktok-yukle.js --gecmis || echo "TikTok gecmis adimi atlandi"

      - name: Bildirim (her adim -> GitHub issue/yorum)
        if: always() && github.event.inputs.kuru != 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node bildirim.js || echo "bildirim atlandi"

      - name: Yorumlara olculu yanit ver (etkilesim)
        if: always() && github.event.inputs.kuru != 'true'
        run: node yorum-yanitla.js || echo "yorum yaniti atlandi (yorum yok / izin yok)"

      - name: Yayin sonrasi analiz (24s/72s/7g/14g/30g checkpoint'leri)
        if: always()
        run: node post-publish-analyzer.js --due || echo "analiz atlandi (kimlik/kapsam yok) — veri uydurulmaz"

      - name: Teknik tartisma sabit yorumlari (public olan videolar)
        if: always() && github.event.inputs.kuru != 'true'
        run: node pinned-comment.js --post-pending || echo "sabit yorum atlandi"

      - name: Kume + ic baglanti plani, deney degerlendirmesi
        if: always()
        run: |
          node channel-plan.js || echo "kanal plani atlandi"
          node experiments.js degerlendir || echo "deneyler atlandi"

      - name: Haftalik mevcut video optimizasyonu (Pazartesi)
        if: always() && github.event_name == 'schedule'
        run: |
          if [ "$(date -u +%u)" = "1" ]; then
            node existing-video-optimizer.js --all || echo "optimizer atlandi"
          else
            echo "Pazartesi degil — optimizer atlandi"
          fi

      - name: Uretilen videoyu artifact olarak yukle (onizleme)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shorts-video
          path: uretim/*/Videos/*.mp4
          if-no-files-found: ignore
          retention-days: 7

      - name: Uretim durumunu geri commit et
        if: always() && github.event.inputs.kuru != 'true'
        run: |
          git config user.name  "uretim-bot"
          git config user.email "actions@users.noreply.github.com"
          # Durum + analiz dosyalari (sir icermez; .env ve medya .gitignore'da)
          git add icerik channel analysis analytics experiments migration || true
          if git diff --cached --quiet; then echo "Uretimde degisiklik yok."; exit 0; fi
          git commit -m "chore: uretim ilerlemesi + analiz (otomatik)"
          # Yaris (baska bir commit araya girdiyse) icin 5 deneme: kayit kaybolursa ayni konu
          # ikinci kez yuklenebilirdi (ek koruma: youtube-yukle.js kanalda ayni basligi arar).
          for i in 1 2 3 4 5; do
            git pull --rebase --autostash origin main && git push && exit 0
            echo "push denemesi $i basarisiz — tekrar"; sleep $((i * 5))
          done
          exit 1

      - name: Hata bildirimi (is akisi coktu)
        if: failure() && github.event.inputs.kuru != 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node bildirim.js --is-hatasi "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
