name: Shorts quality preview

# Renders one Short per channel on the production path WITHOUT uploading,
# committing or notifying, and keeps the MP4s as an artifact for review.
# Runs on pushes to shorts-quality branches and on demand.
on:
  push:
    branches: ['feat/shorts-quality**']
  workflow_dispatch:
    inputs:
      fr_slug:
        description: Failure Reconstructed topic slug
        default: lower-van-norman-dam-1971
      ib_slug:
        description: ImpossibleBrief topic slug
        default: what-if-we-swam-in-europas-ocean
      ct_slug:
        description: CriticalThread topic slug
        default: inside-the-system-built-around-road-tunnel-ventilation-system
      bto_slug:
        description: The Hidden Logic of Things topic slug
        default: why-jeans-have-a-tiny-pocket

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # The Hidden Logic of Things is inactive (config/channels.json enabled:false).
        channel: [failure-reconstructed, impossible-brief, critical-thread]
    env:
      PEXELS_KEY: ${{ secrets.PEXELS_KEY }}
      FR_SLUG: ${{ inputs.fr_slug || 'lower-van-norman-dam-1971' }}
      IB_SLUG: ${{ inputs.ib_slug || 'what-if-we-swam-in-europas-ocean' }}
      CT_SLUG: ${{ inputs.ct_slug || 'inside-the-system-built-around-road-tunnel-ventilation-system' }}
      BTO_SLUG: ${{ inputs.bto_slug || 'why-jeans-have-a-tiny-pocket' }}
      # When Edge refuses the runner, previews are narrated by the channel's (unapproved) fallback
      # voice instead of a tone, so the preview shows real speech. Never uploaded (PUBLISH=0).
      SHORTS_TTS_FALLBACK: preview
      SHORTS_KOKORO_DIR: ${{ github.workspace }}/kokoro-model
      SHORTS_KOKORO_PYTHON: python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: ffmpeg + fonts
        run: |
          bash scripts/ci-apt.sh --no-install-recommends ffmpeg fonts-dejavu-core fonts-liberation python3-pil
          npm install --no-audit --no-fund
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Offline fallback voice (Kokoro-82M, pinned)
        run: |
          pip install --quiet kokoro-onnx==0.6.1 soundfile
          mkdir -p kokoro-model
          curl -fL --retry 3 -sS -o kokoro-model/kokoro-v1.0.onnx https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/kokoro-v1.0.onnx
          curl -fL --retry 3 -sS -o kokoro-model/voices-v1.0.bin https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/voices-v1.0.bin
          echo "7d5df8ecf7d4b1878015a32686053fd0eebe2bc377234608764cc0ef3636a6c5  kokoro-model/kokoro-v1.0.onnx" | sha256sum -c -
          echo "bca610b8308e8d99f32e6fe4197e7ec01679264efed0cac9140fe9c29f1fbf7d  kokoro-model/voices-v1.0.bin" | sha256sum -c -
      - name: Render without upload
        env:
          PUBLISH: '0'
          SAGLIK_ATLA: '1'
          CHANNEL: ${{ matrix.channel }}
          # A visual preview, never an upload: the topic-level growth gate is printed but does not stop
          # the render (the default preview topics drifted below the viral minimum after 2026-10-04).
          GROWTH_GATE_MODE: shadow
        run: |
          mkdir -p preview
          if [ "$CHANNEL" = "failure-reconstructed" ]; then
            node shorts-sira.js --channel failure-reconstructed "$FR_SLUG"
            cp "uretim/$FR_SLUG/Videos/$FR_SLUG.mp4" preview/
            cp "icerik/paket/$FR_SLUG/quality-gate.json" "preview/$FR_SLUG.quality-gate.json" 2>/dev/null || true
            cp "uretim/$FR_SLUG/Videos/denetim.json" "preview/$FR_SLUG.denetim.json" 2>/dev/null || true
          else
            if [ "$CHANNEL" = "impossible-brief" ]; then
              SLUG="$IB_SLUG"
            elif [ "$CHANNEL" = "critical-thread" ]; then
              SLUG="$CT_SLUG"
            else
              SLUG="$BTO_SLUG"
            fi
            node scripts/quality-preview.js --channel "$CHANNEL" "$SLUG" --advisory-readiness
            DIR="channels/$CHANNEL/reports/previews/$SLUG"
            cp "$DIR/$SLUG.mp4" preview/
            cp "$DIR/render.json" "preview/$SLUG.render.json"
            cp "$DIR/metadata.json" "preview/$SLUG.metadata.json"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: preview-${{ matrix.channel }}
          path: preview/
          if-no-files-found: warn
          retention-days: 14

  voice-samples:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install --no-audit --no-fund
      - name: Read one line in each free Edge voice
        run: node scripts/voice-samples.js voice-samples
      - uses: actions/upload-artifact@v4
        with:
          name: voice-samples
          path: voice-samples/
          retention-days: 14
