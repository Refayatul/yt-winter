name: Shorts quality preview

# Renders one Short per channel on the production path WITHOUT uploading,
# committing publication state or notifying. This temporary branch also
# materializes the renderer fix once, then validates the resulting branch head.
on:
  push:
    branches: ['feat/shorts-quality**']
  workflow_dispatch:
    inputs:
      fr_slug:
        description: Failure Reconstructed topic slug
        default: rana-plaza-2013
      ib_slug:
        description: ImpossibleBrief topic slug
        default: what-if-the-dinosaur-killing-asteroid-hit-today
      ct_slug:
        description: CriticalThread topic slug
        default: what-quietly-depends-on-uninterruptible-power-supply
      bto_slug:
        description: The Hidden Logic of Things topic slug
        default: why-the-bluetooth-logo-looks-like-that

permissions:
  contents: write

jobs:
  materialize-render-fix:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/shorts-quality-replacement-final
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply renderer fix and persist if needed
        run: |
          node scripts/apply-final-render-fixes.js
          if git diff --quiet -- core/rendering/topic-visuals.js; then
            echo "Renderer fix already materialized."
            exit 0
          fi
          git config user.name "quality-preview-bot"
          git config user.email "actions@users.noreply.github.com"
          git add core/rendering/topic-visuals.js
          git commit -m "fix(render): improve semantic matching and sparse visual variety"
          git push origin HEAD:feat/shorts-quality-replacement-final

  preview:
    needs: materialize-render-fix
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        channel: [failure-reconstructed, impossible-brief, critical-thread, behind-the-ordinary]
    env:
      PEXELS_KEY: ${{ secrets.PEXELS_KEY }}
      FR_SLUG: ${{ inputs.fr_slug || 'rana-plaza-2013' }}
      IB_SLUG: ${{ inputs.ib_slug || 'what-if-the-dinosaur-killing-asteroid-hit-today' }}
      CT_SLUG: ${{ inputs.ct_slug || 'what-quietly-depends-on-uninterruptible-power-supply' }}
      BTO_SLUG: ${{ inputs.bto_slug || 'why-the-bluetooth-logo-looks-like-that' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/shorts-quality-replacement-final
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: ffmpeg + fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg fonts-dejavu-core fonts-liberation
          npm install --no-audit --no-fund
      - name: Render without upload
        env:
          PUBLISH: '0'
          SAGLIK_ATLA: '1'
          CHANNEL: ${{ matrix.channel }}
        run: |
          mkdir -p preview
          if [ "$CHANNEL" = "failure-reconstructed" ]; then
            node shorts-sira.js --channel failure-reconstructed "$FR_SLUG"
            cp "uretim/$FR_SLUG/Videos/$FR_SLUG.mp4" preview/
            cp "icerik/paket/$FR_SLUG/quality-gate.json" "preview/$FR_SLUG.quality-gate.json" 2>/dev/null || true
            cp "uretim/$FR_SLUG/Videos/denetim.json" "preview/$FR_SLUG.denetim.json" 2>/dev/null || true
          else
            if [ "$CHANNEL" = "impossible-brief" ]; then
              SLUG="$IB_SLUG"
            elif [ "$CHANNEL" = "critical-thread" ]; then
              SLUG="$CT_SLUG"
            else
              SLUG="$BTO_SLUG"
            fi
            node scripts/quality-preview.js --channel "$CHANNEL" "$SLUG"
            DIR="channels/$CHANNEL/reports/previews/$SLUG"
            cp "$DIR/$SLUG.mp4" preview/
            cp "$DIR/render.json" "preview/$SLUG.render.json"
            cp "$DIR/metadata.json" "preview/$SLUG.metadata.json"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: preview-${{ matrix.channel }}
          path: preview/
          if-no-files-found: warn
          retention-days: 14
