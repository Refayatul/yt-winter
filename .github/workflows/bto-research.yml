name: The Hidden Logic of Things research

# Daily, evidence-first research replenishes the production-ready inventory.
# Failed/unverified questions remain in the backlog; nothing is rendered/uploaded here.
on:
  schedule:
    - cron: '41 4 * * *'
  workflow_dispatch:
    inputs:
      limit:
        description: Questions to research in this run
        default: '4'

concurrency:
  group: bto-research
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      LONGFORM_LLM_PROVIDER: ${{ vars.LONGFORM_LLM_PROVIDER }}
      LONGFORM_LLM_FALLBACK_PROVIDER: ${{ vars.LONGFORM_LLM_FALLBACK_PROVIDER }}
      LONGFORM_LLM_MAX_ATTEMPTS: '4'
      LONGFORM_LLM_MAX_RETRY_MS: '120000'
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      GROQ_MODEL: ${{ vars.GROQ_MODEL }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      ANTHROPIC_MODEL: ${{ vars.ANTHROPIC_MODEL }}
      BTO_RESEARCH_PAUSE_MS: '75000'
      BTO_RESEARCH_MAX_TOKENS: '2200'
      BTO_RESEARCH_EXCERPT_CHARS: '7000'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install --no-audit --no-fund
      - name: Activate authority discovery v5
        run: |
          node scripts/bto-wire-discovery-v2.js
          grep -q 'AuthorityDiscovery.discover' scripts/bto-research.js
          grep -q 'const AuthorityDiscovery' scripts/bto-research.js
          node -e "const a=require('./scripts/bto-authority-discovery'); if(typeof a.discover!=='function') process.exit(1); console.log('BTO authority discovery v5 verified')"
      - name: Validate Groq JSON reasoning request
        run: |
          node scripts/bto-groq-json-compat.js
          grep -q 'reasoning_format: "hidden"' core/llm/longform-provider.js
      - name: Research and verify
        run: node scripts/bto-research.js --limit "${{ inputs.limit || '4' }}" --write
      - name: Commit researched records
        run: |
          git config user.name "research-bot"
          git config user.email "actions@users.noreply.github.com"
          git add channels/behind-the-ordinary/topics
          if [ -f channels/behind-the-ordinary/state/research-attempts.json ]; then git add channels/behind-the-ordinary/state/research-attempts.json; fi
          if git diff --cached --quiet; then echo "unchanged"; exit 0; fi
          git commit -m "chore(bto): researched topic records"
          for i in 1 2 3 4 5; do git pull --rebase --autostash origin "$GITHUB_REF_NAME" && git push origin "HEAD:$GITHUB_REF_NAME" && exit 0; sleep $((i * 5)); done
          exit 1
