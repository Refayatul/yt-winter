name: ProfitDecoded voice audition

# Renders the same three documentary sentences with free voices (Kokoro open-source voices and the
# edge-tts fallback) and uploads them as an artifact, so a human can pick the narrator by ear.
# No secrets, no YouTube.
# The cartesia job (paid credits, PD_CARTESIA_API_KEY) runs ONLY on a manual dispatch with the cartesia input set:
#   cartesia=list                         lists en-US voices (metadata only, no credits)
#   cartesia=label=uuid,label=uuid,...    renders the fixed excerpt once per voice, capped by cartesia_max_chars
#   cartesia=narrate                      narrates cartesia_bundle with the configured voice (config voice.cartesiaVoiceId),
#                                         once; every sentence is cached and uploaded so re-mixes never call Cartesia again
on:
  pull_request:
    paths:
      - 'scripts/profitdecoded/voice-audition.js'
      - 'scripts/profitdecoded/kokoro_tts.py'
      - 'core/profitdecoded/tts-provider.js'
      - '.github/workflows/profitdecoded-voice-audition.yml'
      - 'channels/profitdecoded/prototypes/**'
  workflow_dispatch:
    inputs:
      cartesia:
        description: 'Cartesia: "list" (free voice list), label=voice-uuid pairs (auditions), or "narrate" (cartesia_bundle). Uses credits except list. Empty = free voices only.'
        required: false
        default: ''
      cartesia_max_chars:
        description: 'Credit cap for this run (1 credit = 1 character sent)'
        required: false
        default: '2000'
      cartesia_bundle:
        description: 'Bundle to narrate when cartesia=narrate'
        required: false
        default: 'channels/profitdecoded/films/hbm-073-gift-cards/bundle.json'

permissions:
  contents: read

jobs:
  audition:
    if: github.event_name != 'workflow_dispatch' || inputs.cartesia == ''
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: System packages (ffmpeg for mp3 decoding)
        run: bash scripts/ci-apt.sh ffmpeg
      - run: npm install --no-audit --no-fund
      - run: pip install --quiet kokoro-onnx soundfile
      - name: Kokoro model cache
        id: kokoro-cache
        uses: actions/cache@v4
        with:
          path: kokoro-model
          key: kokoro-onnx-model-files-v1.0
      - name: Kokoro model files (download once, then cached)
        if: steps.kokoro-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p kokoro-model
          curl -fL --retry 3 -o kokoro-model/kokoro-v1.0.onnx https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/kokoro-v1.0.onnx
          curl -fL --retry 3 -o kokoro-model/voices-v1.0.bin https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/voices-v1.0.bin
      - name: Kokoro smoke test (helper run directly, output visible)
        run: |
          ls -la kokoro-model
          echo "Costco did not make most of its profit in the aisles." | python scripts/profitdecoded/kokoro_tts.py --model kokoro-model/kokoro-v1.0.onnx --voices kokoro-model/voices-v1.0.bin --voice am_michael --speed 1.0 --out smoke.wav
          ls -la smoke.wav
      - name: Kokoro voices
        env:
          PD_KOKORO_MODEL: ${{ github.workspace }}/kokoro-model/kokoro-v1.0.onnx
          PD_KOKORO_VOICES: ${{ github.workspace }}/kokoro-model/voices-v1.0.bin
          PD_KOKORO_PYTHON: python
        # The same fixed 45-second excerpt (the gift-card opening) for every voice, at the channel rate.
        run: node scripts/profitdecoded/voice-audition.js audition-out --provider kokoro --rate -3% --text-file channels/profitdecoded/prototypes/gift-cards-first-minute/audition-excerpt.txt --voices am_michael,am_fenrir,am_puck,af_heart,af_bella,bm_george
      - name: edge-tts voices (comparison only; not licensed for monetised use)
        continue-on-error: true
        run: node scripts/profitdecoded/voice-audition.js audition-out --provider edge-tts --rate -3% --text-file channels/profitdecoded/prototypes/gift-cards-first-minute/audition-excerpt.txt --voices en-US-AndrewMultilingualNeural,en-US-BrianMultilingualNeural,en-US-ChristopherNeural
      - name: First-minute prototype narration (Kokoro, channel voice; internal test, no upload)
        env:
          PD_TTS_PROVIDER: kokoro
          PD_KOKORO_MODEL: ${{ github.workspace }}/kokoro-model/kokoro-v1.0.onnx
          PD_KOKORO_VOICES: ${{ github.workspace }}/kokoro-model/voices-v1.0.bin
          PD_KOKORO_PYTHON: python
        run: |
          node scripts/profitdecoded/produce-audio.js channels/profitdecoded/prototypes/gift-cards-first-minute/bundle.json
          mkdir -p audition-out/prototype
          cp channels/profitdecoded/prototypes/gift-cards-first-minute/out/* audition-out/prototype/
          cp channels/profitdecoded/prototypes/gift-cards-first-minute/bundle.json audition-out/prototype/bundle.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: profitdecoded-voice-audition
          path: audition-out/
          if-no-files-found: warn
          retention-days: 14

  cartesia:
    if: github.event_name == 'workflow_dispatch' && inputs.cartesia != ''
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # One run at a time, never cancelled midway: a duplicate dispatch waits instead of paying twice.
    concurrency:
      group: profitdecoded-cartesia
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: System packages (ffmpeg for m4a)
        run: bash scripts/ci-apt.sh ffmpeg
      - run: npm install --no-audit --no-fund
      - name: Cartesia voice list (metadata only, no credits)
        if: inputs.cartesia == 'list'
        env:
          PD_CARTESIA_API_KEY: ${{ secrets.PD_CARTESIA_API_KEY }}
        run: |
          mkdir -p audition-out
          node scripts/profitdecoded/cartesia-voices.js --language en-US --out audition-out/cartesia-voices-en-US.json
      - name: Cartesia auditions (same fixed excerpt, one request per voice, no retries)
        if: inputs.cartesia != 'list' && inputs.cartesia != 'narrate'
        env:
          PD_CARTESIA_API_KEY: ${{ secrets.PD_CARTESIA_API_KEY }}
          PD_CARTESIA_MAX_CHARS: ${{ inputs.cartesia_max_chars }}
          VOICES: ${{ inputs.cartesia }}
        run: node scripts/profitdecoded/voice-audition.js audition-out --provider cartesia --rate -3% --text-file channels/profitdecoded/prototypes/gift-cards-first-minute/audition-excerpt.txt --voices "$VOICES"
      - name: Cartesia full narration (configured voice, one pass, per-sentence cache, no retries)
        if: inputs.cartesia == 'narrate'
        env:
          PD_TTS_PROVIDER: cartesia
          PD_CARTESIA_API_KEY: ${{ secrets.PD_CARTESIA_API_KEY }}
          PD_CARTESIA_MAX_CHARS: ${{ inputs.cartesia_max_chars }}
          BUNDLE: ${{ inputs.cartesia_bundle }}
          # Credits this repository has spent this month, from channels/profitdecoded/reports/voice-audition/cartesia/*-index.json
          RECORDED: '2082'
        run: |
          node scripts/profitdecoded/cartesia-credits.js --need "$PD_CARTESIA_MAX_CHARS" --recorded-used "$RECORDED"
          node scripts/profitdecoded/produce-audio.js "$BUNDLE"
          D=$(dirname "$BUNDLE"); mkdir -p audition-out/narration
          cp -R "$D/out" audition-out/narration/out; cp -R "$D/tts-cache" audition-out/narration/tts-cache; cp "$BUNDLE" audition-out/narration/bundle.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: profitdecoded-cartesia-audition
          path: audition-out/
          if-no-files-found: warn
          retention-days: 30
