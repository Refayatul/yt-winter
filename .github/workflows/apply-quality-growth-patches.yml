name: Apply quality growth patches

on:
  push:
    branches:
      - quality-growth-replacements-2026-10-04

permissions:
  contents: write

jobs:
  apply:
    if: "!contains(github.event.head_commit.message, 'feat: harden quality and growth gates')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: quality-growth-replacements-2026-10-04
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply staged patches
        run: |
          set -euo pipefail
          for p in .codex-patches/q*.patch; do
            git apply --check "$p"
            git apply "$p"
          done
      - name: Run full JavaScript regression suite
        run: npm run test:js
      - name: Commit final source changes
        run: |
          set -euo pipefail
          rm -rf .codex-patches
          rm -f .github/workflows/apply-quality-growth-patches.yml
          git config user.name "quality-growth-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "feat: harden quality and growth gates"
          git push origin HEAD:quality-growth-replacements-2026-10-04
